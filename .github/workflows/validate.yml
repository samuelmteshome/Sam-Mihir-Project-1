name: Validate source data

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test acquisition safeguards
        run: python -m unittest discover -s tests -v
      - name: Validate committed source snapshots without network access
        run: python scripts/validate_data.py
      - name: Check Python syntax
        run: python -m compileall -q scripts tests
