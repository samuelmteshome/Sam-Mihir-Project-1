name: Validate source data

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Test acquisition safeguards
        run: python -m unittest discover -s tests -v
      - name: Validate committed source snapshots without network access
        run: python scripts/validate_data.py
      - name: Check Python syntax
        run: python -m compileall -q scripts tests
      - name: Reproduce distance and mortality analysis offline
        run: python scripts/06_analyze_access_outcomes.py
      - name: Verify regenerated feature outputs
        run: python -m unittest discover -s tests -p test_access_outcomes.py -v
